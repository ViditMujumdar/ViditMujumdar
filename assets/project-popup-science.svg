<svg xmlns="http://www.w3.org/2000/svg" width="460" height="360" viewBox="0 0 460 360" role="img" aria-label="Pop-Up Science: AI · 3D HOMEWORK HELPER">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d0920"/>
    <stop offset=".55" stop-color="#22144a"/>
    <stop offset="1" stop-color="#4a2a80"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#cbb6ff" stop-opacity=".55"/>
    <stop offset="1" stop-color="#cbb6ff" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="top"><rect x="8" y="8" width="444" height="198" rx="8"/></clipPath>
</defs>
<style>
  .tw{animation:tw 3.2s ease-in-out infinite}
  .tw2{animation:tw 4.6s ease-in-out infinite;animation-delay:1.3s}
  .tw3{animation:tw 2.4s ease-in-out infinite;animation-delay:.7s}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  .cur{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .drift{animation:drift 26s linear infinite}
  .drift2{animation:drift 38s linear infinite;animation-delay:-12s}
  @keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
  .win{animation:win 5s steps(1) infinite}
  @keyframes win{0%,70%{opacity:1}71%,85%{opacity:.25}86%{opacity:1}}
  .shoot{animation:shoot 7s ease-in infinite}
  @keyframes shoot{0%,82%{transform:translate(0,0);opacity:0}84%{opacity:1}96%{transform:translate(-260px,120px);opacity:0}100%{opacity:0}}
  .bob{animation:bob 4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .spin{animation:spin 9s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  .dash{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-28}}
</style>
